stage: c3
mode_token: "<|site|>"
max_seq_len: 1024
data_manifest: datasets/processed/ds_site_v1/manifest.json
replay_manifests:
  - datasets/processed/ds_comp_v1/manifest.json
  - datasets/processed/ds_page_v1/manifest.json
replay_prev_ratio: 0.3
