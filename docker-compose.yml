services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: builder
      POSTGRES_PASSWORD: builder
      POSTGRES_DB: ai_builder
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U builder -d ai_builder"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    env_file:
      - ./apps/api/.env
    environment:
      DATABASE_URL: postgresql+psycopg://builder:builder@db:5432/ai_builder
      ARTIFACT_ROOT: /data/artifacts
    ports:
      - "8000:8000"
    volumes:
      - artifacts:/data/artifacts
      - ./apps/api:/app
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  worker:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    env_file:
      - ./apps/api/.env
    environment:
      DATABASE_URL: postgresql+psycopg://builder:builder@db:5432/ai_builder
      ARTIFACT_ROOT: /data/artifacts
    volumes:
      - artifacts:/data/artifacts
      - ./apps/api:/app
    depends_on:
      db:
        condition: service_healthy
    command: python -m app.workers.generation_worker

volumes:
  pgdata:
  artifacts:
